[package]
name = "nexus"
version = "0.1.0"
description = "Nexus — Notes for Humans and Agents"
authors = ["Nexus"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-persisted-scope = "2"
# On-disk DurableIndex (FTS5 via bundled SQLite — no system lib required)
rusqlite = { version = "0.32", features = ["bundled"] }
# OS-level recursive file watching (replaces full-tree poll on desktop)
notify = "6"
notify-debouncer-mini = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
