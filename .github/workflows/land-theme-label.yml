name: land theme label
on:
  push:
    branches: [cursor/graph-hud-release-690a]
    paths:
      - scripts/theme-label.d/patch.b64
jobs:
  land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          python3 -c 'import base64,pathlib; p=pathlib.Path("scripts/theme-label.d/patch.b64").read_text().strip(); pathlib.Path("/tmp/theme-label.patch").write_bytes(base64.b64decode(p))'
          echo "bd01ce577e896ae283d608b7733d66c5d2b813f704c31ef852c76f16ade20538  /tmp/theme-label.patch" | sha256sum -c
          git apply --check /tmp/theme-label.patch
          git apply /tmp/theme-label.patch
          git add src/components/chrome/ThemeToggle.tsx src/components/settings/SettingsPanel.tsx
          git rm -f scripts/theme-label.d/patch.b64 .github/workflows/land-theme-label.yml
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "fix: theme control label matches the paint on the same click"
          git push origin HEAD:cursor/graph-hud-release-690a
