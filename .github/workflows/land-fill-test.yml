name: land-fill-test
on:
  push:
    branches:
      - cursor/graph-hud-release-690a
    paths:
      - scripts/gate-c/**
permissions:
  contents: write
jobs:
  land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Expect the finished empty-search line
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          p = Path("scripts/test-sqlite-fill-progress.mjs")
          text = p.read_text()
          old = "  /current search index/,"
          new = "  /No notes match/,"
          if text.count(old) != 1:
              raise SystemExit(f"expected one old assertion, found {text.count(old)}")
          p.write_text(text.replace(old, new, 1))
          PY
          test "$(git hash-object scripts/test-sqlite-fill-progress.mjs)" = "91e29890346ee012b525acb452474ad3d09e6d8f"
          test "$(git hash-object src/components/graph/GraphView.tsx)" = "e4fbee6dd1e0d5308f09f639a6b602aacf23d46b"
          test "$(git hash-object src/lib/vault/store.ts)" = "d30ce53af755ba4a95b680c4d169e4e505931557"
          test "$(git hash-object src/components/layout/AppShell.tsx)" = "b6281c4b3f6aa13fe6fed4dd3de1bc7fb29647d1"
          git config user.email "cursoragent@cursor.com"
          git config user.name "Cursor Agent"
          git add scripts/test-sqlite-fill-progress.mjs
          git rm -r scripts/gate-c
          git rm -f .github/workflows/land-fill-test.yml
          git commit -m "test: expect the finished search empty state"
          git push origin HEAD:cursor/graph-hud-release-690a
