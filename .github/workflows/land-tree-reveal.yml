name: land-tree-reveal
on:
  push:
    branches: [cursor/graph-hud-release-690a]
    paths:
      - .github/workflows/land-tree-reveal.yml
jobs:
  land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/graph-hud-release-690a
          fetch-depth: 1
      - name: apply reveal patch
        run: |
          set -euo pipefail
          python3 -c 'import base64,pathlib; pathlib.Path("/tmp/tree-reveal.patch").write_bytes(base64.b64decode(pathlib.Path("scripts/tree-reveal.d/patch.b64").read_text()))'
          echo "08c126ee0b749df5b2eb2ec0b6379dca81d412a1a8de5d6c512cdc7ce9995c8b  /tmp/tree-reveal.patch" | sha256sum -c
          git apply --check /tmp/tree-reveal.patch
          git apply /tmp/tree-reveal.patch
          echo "f37dab961f91ae20701ac53cfd44eb90cb983754a9af7090bdb8fb3909b4a3a6  src/components/vault/FileTree.tsx" | sha256sum -c
          git add src/components/vault/FileTree.tsx
          git rm -r scripts/tree-reveal.d
          git rm .github/workflows/land-tree-reveal.yml
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "fix: show folder children when a large-vault tree row expands"
          git push origin HEAD:cursor/graph-hud-release-690a
