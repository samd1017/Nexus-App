name: Build Desktop

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (macOS Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.1.0-alpha' }}
          releaseName: 'Nexus ${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.1.0-alpha' }}'
          releaseBody: |
            ## Alpha — early preview builds

            Expect bugs. These builds are **not code-signed or notarized**.

            ### Downloads
            - **macOS (Apple Silicon):** `.dmg` in the assets below
            - **Windows:** NSIS `.exe` installer in the assets below

            ### Installing unsigned builds

            **macOS**
            1. Open the `.dmg` and drag Nexus to Applications.
            2. On first launch, right-click the app → **Open** (or System Settings → Privacy & Security → Open Anyway).
            3. Gatekeeper will warn because the build is unsigned. That is expected for Alpha.

            **Windows**
            1. Run the `.exe` installer.
            2. If SmartScreen appears (“Windows protected your PC”), click **More info** → **Run anyway**.
            3. That warning is expected for unsigned Alpha builds.

            Build from source instead: see DESKTOP.md in the repo.
          releaseDraft: true
          prerelease: true
          args: --target aarch64-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (Windows NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.1.0-alpha' }}
          releaseName: 'Nexus ${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.1.0-alpha' }}'
          releaseBody: |
            ## Alpha — early preview builds

            Expect bugs. These builds are **not code-signed or notarized**.

            ### Downloads
            - **macOS (Apple Silicon):** `.dmg` in the assets below
            - **Windows:** NSIS `.exe` installer in the assets below

            ### Installing unsigned builds

            **macOS**
            1. Open the `.dmg` and drag Nexus to Applications.
            2. On first launch, right-click the app → **Open** (or System Settings → Privacy & Security → Open Anyway).
            3. Gatekeeper will warn because the build is unsigned. That is expected for Alpha.

            **Windows**
            1. Run the `.exe` installer.
            2. If SmartScreen appears (“Windows protected your PC”), click **More info** → **Run anyway**.
            3. That warning is expected for unsigned Alpha builds.

            Build from source instead: see DESKTOP.md in the repo.
          releaseDraft: true
          prerelease: true
          args: ''

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
