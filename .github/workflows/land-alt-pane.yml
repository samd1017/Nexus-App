name: land alt pane
on:
  push:
    branches: [cursor/graph-hud-release-690a]
    paths:
      - scripts/alt-pane.d/patch.b64
jobs:
  land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          python3 -c 'import base64,pathlib; p=pathlib.Path("scripts/alt-pane.d/patch.b64").read_text().strip(); pathlib.Path("/tmp/alt-pane.patch").write_bytes(base64.b64decode(p))'
          echo "c2c7a0bae060aa5a61983c78af6bcf8262bee4fd95c342f9af54be516af4ad00  /tmp/alt-pane.patch" | sha256sum -c
          git apply --check /tmp/alt-pane.patch
          git apply /tmp/alt-pane.patch
          git add src/components/vault/FileTree.tsx
          git rm -f scripts/alt-pane.d/patch.b64 .github/workflows/land-alt-pane.yml
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "fix: alt-click a file into the second pane"
          git push origin HEAD:cursor/graph-hud-release-690a
