name: land-craft-b
on:
  push:
    branches:
      - cursor/graph-hud-release-690a
    paths:
      - scripts/craft-b.patch.b64
jobs:
  land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/graph-hud-release-690a
          fetch-depth: 1
      - name: Apply verified patch
        run: |
          set -euo pipefail
          base64 -d scripts/craft-b.patch.b64 > /tmp/craft-b.patch
          echo "27735d6600a21a78bbf3be78d34f455e08ec847725d53f27e3e31f65e2f38449  /tmp/craft-b.patch" | sha256sum -c
          git apply --check /tmp/craft-b.patch
          git apply /tmp/craft-b.patch
          git rm -f scripts/craft-b.patch.b64 .github/workflows/land-craft-b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SCALING.md src/components/chrome/FirstRunCoach.tsx src/components/editor/FrontmatterEditor.tsx src/components/vault/WelcomeScreen.tsx
          git commit -m "fix: quiet focus mode and state the real scale limits"
          git push origin HEAD:cursor/graph-hud-release-690a
