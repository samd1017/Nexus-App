name: land-settings-craft
on:
  push:
    branches: [cursor/graph-hud-release-690a]
    paths:
      - .github/workflows/land-settings-craft.yml
permissions:
  contents: write
jobs:
  land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/graph-hud-release-690a
      - name: apply
        run: |
          set -euo pipefail
          cat scripts/settings-craft.d/p0 scripts/settings-craft.d/p1 scripts/settings-craft.d/p2 scripts/settings-craft.d/p3 > /tmp/craft.b64
          base64 -d /tmp/craft.b64 > /tmp/settings-craft.patch
          echo "271624f736fcca474604956caaf4c517a4b3968a4355191baa3aacf3f2e6fa62  /tmp/settings-craft.patch" | sha256sum -c
          git apply --check /tmp/settings-craft.patch
          git apply /tmp/settings-craft.patch
          git add package.json src/styles.css src/components/settings/SettingsPanel.tsx scripts/test-tree-tick.mjs
          git diff --cached --name-only | grep -qx 'scripts/test-tree-tick.mjs'
          git rm -f --ignore-unmatch scripts/settings-craft.d/p0 scripts/settings-craft.d/p1 scripts/settings-craft.d/p2 scripts/settings-craft.d/p3 .github/workflows/land-settings-craft.yml
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "fix: finish light settings and lock the file-tree tick"
          git push origin HEAD:cursor/graph-hud-release-690a
