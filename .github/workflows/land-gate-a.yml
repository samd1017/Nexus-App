name: land-gate-a
on:
  push:
    branches:
      - cursor/graph-hud-release-690a
    paths:
      - scripts/gate-a/**
permissions:
  contents: write
jobs:
  land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply local blobs
        run: |
          set -euo pipefail
          if [ ! -f scripts/gate-a/store.patch.b64 ] || [ ! -f scripts/gate-a/GraphView.patch.b64 ]; then
            echo "waiting for both patches"
            exit 0
          fi
          base64 -d scripts/gate-a/store.patch.b64 > /tmp/store.patch
          base64 -d scripts/gate-a/GraphView.patch.b64 > /tmp/gv.patch
          echo "36836cd83c29c9b087dc46c7705e0226c0b4de041c06e08dfe4af93672eaa06b  /tmp/store.patch" | sha256sum -c -
          echo "386132604f861799c4a9d8c673ba10d9b66b794e55fbb66b7af758a6f16bc1a4  /tmp/gv.patch" | sha256sum -c -
          patch --forward --batch src/lib/vault/store.ts /tmp/store.patch
          patch --forward --batch src/components/graph/GraphView.tsx /tmp/gv.patch
          test "$(git hash-object src/lib/vault/store.ts)" = "d30ce53af755ba4a95b680c4d169e4e505931557"
          test "$(git hash-object src/components/graph/GraphView.tsx)" = "e4fbee6dd1e0d5308f09f639a6b602aacf23d46b"
          git config user.email "cursoragent@cursor.com"
          git config user.name "Cursor Agent"
          git add src/lib/vault/store.ts src/components/graph/GraphView.tsx
          git rm -r scripts/gate-a
          git rm -f .github/workflows/land-gate-a.yml
          git commit -m "fix: land GraphView and store blobs"
          git push origin HEAD:cursor/graph-hud-release-690a
