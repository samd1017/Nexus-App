name: land slash placeholder

on:
  push:
    branches:
      - cursor/graph-hud-release-690a
    paths:
      - scripts/land-slash-placeholder.d/patch.b64

jobs:
  land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/graph-hud-release-690a
      - name: Apply placeholder patch
        run: |
          python3 -c "import base64,pathlib; pathlib.Path('/tmp/slash.patch').write_bytes(base64.b64decode(pathlib.Path('scripts/land-slash-placeholder.d/patch.b64').read_text().strip()))"
          echo "36c7a6e24821cecff52ebf9f0f8b9c7cbf9f77e76ff9a831d24de756f768a021  /tmp/slash.patch" | sha256sum -c -
          git apply --check /tmp/slash.patch
          git apply /tmp/slash.patch
          git add src/components/editor/VisualEditor.tsx src/lib/editor/safe-placeholder.ts src/lib/editor/__tests__/safe-placeholder.mjs
          git rm -f scripts/land-slash-placeholder.d/patch.b64 .github/workflows/land-slash-placeholder.yml
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "fix: slash insert no longer throws on placeholder map"
          git push origin HEAD:cursor/graph-hud-release-690a
