name: sanitize tree

on:
  push:
    paths:
      - .github/workflows/sanitize-tree.yml

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/graph-hud-release-690a

      - name: apply sanitizer and drop tracked seed
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          parts = [Path(f"scripts/.san-r{i:02d}").read_bytes() for i in range(6)]
          text = b"".join(parts).decode()
          text = text.replace("\\u2014", "\u2014").replace("\\u2026", "\u2026")
          Path("/tmp/compact-sanitize.py").write_text(text)
          PY
          echo "e718ccd655719925701ae1db6dc3a7d3abd5d931530c36bef8d4f72616da8a97  /tmp/compact-sanitize.py" | sha256sum -c
          python3 /tmp/compact-sanitize.py "$PWD"
          python3 - << 'PY'
          import subprocess, sys
          expected = """
          2fe8221a9fa3cdc2748e3488d438395d887ab228 CONTRIBUTING.md
          b95f3d856bfad23c71bca32c77a7430784e10538 DESKTOP.md
          178392ca55082de6113760ad7a522abd2aff3163 README.md
          5acb39499ed314121f9a2a98fbc481a5557378d7 docs/SCALE_SOAK_REPORT.md
          496eedec6bcf70aded3ed12d81af009ad290e4f8 docs/SCALING.md
          3fc2d039fcc6675181e3446413156672dce1e7b4 package.json
          ec1c23b278f4c338a92293c965f8899012a15732 scripts/browser-smoke.mjs
          d9453f0c5409499700478949c50d1deabba281ff scripts/gen-soak-vault.mjs
          070f5d0a3c7e4739db9923e723ccf736e9b277a8 scripts/preview-thumbnail.mjs
          0eaebd65868d99e4f200f682e794223dcabf1094 scripts/qa-single-path.mjs
          f0a5c7097761d5c3277896909879c9f9b7c38296 scripts/qa-visual-folder-graph.mjs
          8d1e315afbcb3813cd9ec04de77b9057a0345e00 scripts/screenshot-dir.mjs
          573803c0450735deab4351c7d9d38cab4681346b scripts/stress-fsa-cdp.mjs
          2ab9feef6beb4b5bac7b5e7a972a22600bc4fe66 scripts/test-desktop-fs-scope.mjs
          97068026964bc87140a63c60c103abad4da42115 scripts/test-disk-fts-fill-run.mts
          db78de961f32d2e6558dcbc79f2767fc1defdb9c scripts/test-large-vault-ui.mjs
          88d64849fe599b6e9106f9e2008030f74505d924 scripts/test-large-vault.mjs
          fef66f642b7fe6fa5b584c13318f7e773f73208f scripts/verify-large-test-vault.mjs
          9436a5e35515a141bb25a91c92f636065ba376cc scripts/wave-c-qa-final.mjs
          b2d24b4614aa726cd5886c5ef90cc14c2a90ef8b scripts/wave-c-qa.mjs
          2ca24f4fc65271645132259f813751ec82eaa84b scripts/wave-c-qa2.mjs
          2f089cc2b41de413086f5c602350d366426662cf src/lib/vault/large-test-vault.ts
          e4fbee6dd1e0d5308f09f639a6b602aacf23d46b src/components/graph/GraphView.tsx
          d30ce53af755ba4a95b680c4d169e4e505931557 src/lib/vault/store.ts
          b6281c4b3f6aa13fe6fed4dd3de1bc7fb29647d1 src/components/layout/AppShell.tsx
          """.strip().splitlines()
          for line in expected:
              sha, path = line.split()
              got = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              if got != sha:
                  sys.exit(f"hash {path} {got} != {sha}")
          print("hashes ok")
          PY
          if git grep -I -n -e 'samd1\\' -e '/workspace/' -- ':!scripts/.san-r00' ':!scripts/.san-r01' ':!scripts/.san-r02' ':!scripts/.san-r03' ':!scripts/.san-r04' ':!scripts/.san-r05' ':!.github/workflows/sanitize-tree.yml' ':!package-lock.json'; then
            echo "dirty path remains"
            exit 1
          fi
          if git grep -I -n '/Users/' -- ':!scripts/.san-r00' ':!scripts/.san-r01' ':!scripts/.san-r02' ':!scripts/.san-r03' ':!scripts/.san-r04' ':!scripts/.san-r05' ':!.github/workflows/sanitize-tree.yml' ':!package-lock.json' | grep -v '/Users/\\*\\*'; then
            echo "home path remains"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add scripts/screenshot-dir.mjs
          git rm -r public/large-test-vault
          git rm -f scripts/.san-r00 scripts/.san-r01 scripts/.san-r02 scripts/.san-r03 scripts/.san-r04 scripts/.san-r05 .github/workflows/sanitize-tree.yml
          if git grep --cached -I -e 'samd1\\' -e '/workspace/' -e 'C:\\Users'; then
            echo "index still dirty"
            exit 1
          fi
          git commit -m "chore: drop personal paths and the tracked 45k seed"
          git push origin HEAD:cursor/graph-hud-release-690a
