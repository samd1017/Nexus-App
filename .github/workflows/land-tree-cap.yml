name: land-tree-cap
on:
  push:
    branches:
      - cursor/graph-hud-release-690a
    paths:
      - .github/workflows/land-tree-cap.yml
permissions:
  contents: write
jobs:
  land:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply file-tree cap patch
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          p2 = list(Path("scripts/tree-cap.d/p2.b64").read_text().rstrip("\n"))
          if p2[4540] != "h":
              assert p2[4540] == "g", p2[4540]
              p2[4540] = "h"
          if p2[6360] != "B":
              assert p2[6360] == "A", p2[6360]
              p2[6360] = "B"
          Path("/tmp/p2.b64").write_text("".join(p2))
          p3 = Path("scripts/tree-cap.d/p3.b64").read_text().rstrip("\n")
          old = "4KKyAqIGFsbG9jYXRlIGEgc2xvdCBmb3IgZXZlcnkgZm9sZGVyIHRoYXQgd2lsbCBiZSBsaXN0ZW"
          new = "kuCisgKiBFdmVyeSBmb2xkZXIgdGhhdCB3aWxsIGJlIGxpc3RlZCBrZWVwcyBhIHNsb3"
          if old in p3:
              p3 = p3.replace(old, new, 1)
          Path("/tmp/p3.b64").write_text(p3)
          PY
          cat scripts/tree-cap.d/p0.b64 scripts/tree-cap.d/p1.b64 /tmp/p2.b64 /tmp/p3.b64 | tr -d '\n' | base64 -d > /tmp/tree-cap.patch
          echo "698882084248b33dd6ae11fa0991167a3175d3108556ee215cb86a4a12911cca  /tmp/tree-cap.patch" | sha256sum -c -
          git apply --check /tmp/tree-cap.patch
          git apply /tmp/tree-cap.patch
          git add src/lib/vault/file-tree-flat.ts src/components/vault/FileTree.tsx scripts/test-file-tree-flat.mjs docs/SCALE_SOAK_REPORT.md
          git rm -f scripts/tree-cap.d/p0.b64 scripts/tree-cap.d/p1.b64 scripts/tree-cap.d/p2.b64 scripts/tree-cap.d/p3.b64 .github/workflows/land-tree-cap.yml
          rmdir scripts/tree-cap.d || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "fix: keep later folders when a large branch expands"
          git push origin HEAD:cursor/graph-hud-release-690a
